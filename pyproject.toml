[project]
name = "Concierge.AI_v2"
version = "0.1.0"
description = "Modular, AI-supported chat assistance for hotels"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.141.1,<0.142",
    "fasttext-predict==0.9.2.4",
    "httpx>=0.28.1,<0.29",
    "huggingface-hub>=0.36.2,<0.37",
    "langgraph>=1.2.10,<1.3",
    "llama-cpp-python==0.3.34",
    "Markdown>=3.10.3,<3.11",
    "pydantic>=2.13.4,<2.14",
    "sentencepiece==0.2.1",
    "streamlit>=1.58.0,<1.59",
    "torch==2.11.0",
    "transformers>=4.57.6,<4.58",
    "uvicorn>=0.52.1,<0.53",
]


[project.optional-dependencies]
dev = [
    "mypy>=2.3.0,<2.4",
    "pytest>=9.1.1,<9.2",
    "pytest-cov>=7.1.0,<7.2",
    "ruff>=0.16.1,<0.17",
    "types-Markdown>=3.10.2.20260712,<3.11",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
disable_error_code = ["union-attr", "return", "arg-type", "assignment"]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
client = [
    "assets/*.css",
    "assets/*.png",
    "assets/*.svg",
    "res/*.jpeg",
    "res/*.jpg",
    "res/*.png",
    "res/*.svg",
    "res/*.webp",
]


[tool.setuptools.packages.find]
where = ["src"]
