[project]
name = "Concierge.AI_v2"
version = "0.1.0"
description = "modular, AI supported chat support for hotels"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "Markdown==3.10.3",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "streamlit==1.58.0",
    "uvicorn==0.52.1",

    # Translator
    "fasttext-predict==0.9.2.4",
    "sentencepiece==0.2.1",
    # python -m pip install torch --index-url https://download.pytorch.org/whl/cu128 
    "torch==2.11.0+cu128",
    "transformers==4.57.6",
]


[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "types-Markdown==3.10.2.20260712",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
disable_error_code = ["union-attr", "return", "arg-type", "assignment"]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
client = [
    "assets/*.css",
    "assets/*.png",
    "assets/*.svg",
    "res/*.jpeg",
    "res/*.jpg",
    "res/*.png",
    "res/*.svg",
    "res/*.webp",
]


[tool.setuptools.packages.find]
where = ["src"]
