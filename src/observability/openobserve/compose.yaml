services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: concierge-ai-openobserve
    restart: unless-stopped

    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD}

    ports:
      - "5080:5080"

    volumes:
      - openobserve-data:/data

  vector:
    image: timberio/vector:0.57.0-debian
    container_name: concierge-ai-vector
    restart: unless-stopped

    depends_on:
      - openobserve

    environment:
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"

    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ../../../logs:/var/log/concierge-ai:ro
      - vector-data:/var/lib/vector

volumes:
  openobserve-data:
  vector-data: